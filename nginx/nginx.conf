events {}

http {

    upstream frontend_add {
        server frontend-add:80;
    }

    upstream frontend_list {
        server frontend-list:80;
    }

    upstream backend {
        server backend:8000;
    }

    server {

        listen 80;

        # API
        location /api/ {
            proxy_pass http://backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Add Achievement App
        location /app1/ {
            proxy_pass http://frontend_add/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # List Achievement App
        location /app2/ {
            proxy_pass http://frontend_list/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
